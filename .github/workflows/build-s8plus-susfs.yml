name: Build S8 Plus SUSFS kernel

on:
  push:
    branches: ['agent/alice-s8plus-susfs-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev lz4 python3 rsync xz-utils zip

      - name: Restore exact V55 config
        run: |
          set -euxo pipefail
          cat configs/v55_chunks/part{00..11}.b64 > V55_CONFIG.b64
          echo 'dacf46588d375e8b3e1943b950260f8c40bacb10f79db143bf0bd4b3488ff2c2  V55_CONFIG.b64' | sha256sum -c -
          base64 -d V55_CONFIG.b64 > V55_CONFIG.gz
          echo '7ca6bc454a72d88477ac94b6baa1185c193339c72d64e3c401a0c94a958b45cf  V55_CONFIG.gz' | sha256sum -c -
          gzip -dc V55_CONFIG.gz > V55_BASELINE.config
          echo '25534172654cc2ef053bc2b2580dc8e0d647a921624ad7bdea54024f07672c07  V55_BASELINE.config' | sha256sum -c -

      - name: Clone pinned V55 source and restore KSU 0.9 hook ABI
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch --branch sep-16.1 https://github.com/boloaimer/exynos-8895.git kernel
          test "$(git -C kernel rev-parse HEAD)" = 'dcdaf6878e7f9497e1d90e25980decfa5d684f74'
          git -C kernel rev-parse HEAD | tee SOURCE_COMMIT.txt
          head -n 5 kernel/Makefile | tee KERNEL_VERSION.txt
          cd kernel
          git config user.name alice-ci
          git config user.email alice-ci@users.noreply.github.com
          git fetch --depth 2 origin f1c5b91a788f38214f04ab22563d0bceac7c2c17
          git revert --no-edit f1c5b91a788f38214f04ab22563d0bceac7c2c17
          git rev-parse HEAD | tee ../KSU_HOOK_COMPAT_COMMIT.txt
          git show --stat --oneline HEAD | tee ../KSU_HOOK_COMPAT_LOG.txt
          cd ..

      - name: Port pinned SUSFS integration
        run: |
          set -euxo pipefail
          cd kernel
          git remote add susfs-port https://github.com/fnr1r/android_kernel_samsung_universal8895.git
          git fetch --depth 2 susfs-port 7bc44731088e0e004345fcd71eac0fbf877849c1
          set +e
          git cherry-pick 7bc44731088e0e004345fcd71eac0fbf877849c1 > ../SUSFS_PORT_LOG.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git status --short | tee ../SUSFS_PORT_STATUS_BEFORE_RESOLVE.txt
            git diff --cc > ../SUSFS_PORT_CONFLICT.diff || true
            git rm -f .gitmodules
            git checkout --ours fs/devpts/inode.c
            git add fs/devpts/inode.c
            python3 -c "from pathlib import Path; p=Path('kernel/sys.c'); s=p.read_text(); a=s.index('<<<<<<< HEAD'); b=s.index('=======',a); m='>>>>>>> 7bc447310 (feat: add susfs4ksu)'; c=s.index(m,b); ours=s[a+len('<<<<<<< HEAD'):b]; theirs=s[b+len('======='):c]; p.write_text(s[:a]+ours+theirs+s[c+len(m):])"
            git add kernel/sys.c
            test -z "$(git diff --name-only --diff-filter=U)"
            GIT_EDITOR=true git cherry-pick --continue >> ../SUSFS_PORT_LOG.txt 2>&1
          fi
          git status --short | tee ../SUSFS_PORT_STATUS.txt
          git show --stat --oneline HEAD | tee -a ../SUSFS_PORT_LOG.txt
          cd ..
          rm -rf kernel/susfs4ksu
          git clone --no-checkout https://gitlab.com/simonpunk/susfs4ksu.git kernel/susfs4ksu
          git -C kernel/susfs4ksu fetch --depth 1 origin 2404aebaeee041c8e0e06ca4636dc87b984c2428
          git -C kernel/susfs4ksu checkout --detach FETCH_HEAD
          test "$(git -C kernel/susfs4ksu rev-parse HEAD)" = '2404aebaeee041c8e0e06ca4636dc87b984c2428'
          git -C kernel/susfs4ksu rev-parse HEAD | tee SUSFS_COMMIT.txt
          test -e kernel/fs/susfs.c
          test -e kernel/include/linux/susfs.h

      - name: Install pinned KernelSU SUSFS fork
        run: |
          set -euxo pipefail
          sed -i '/fetch-latest-kernelsu\.sh/d' kernel/scripts/Kbuild.include
          ! grep -q 'fetch-latest-kernelsu.sh' kernel/scripts/Kbuild.include
          git clone --no-checkout https://github.com/fnr1r/KernelSU.git ksu
          git -C ksu fetch --depth 1 origin ee03fa5bdd1eece21b15581b3bccd06c9d30afc1
          git -C ksu checkout --detach FETCH_HEAD
          test "$(git -C ksu rev-parse HEAD)" = 'ee03fa5bdd1eece21b15581b3bccd06c9d30afc1'
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          cp -a ksu/kernel/. kernel/drivers/kernelsu/
          git -C ksu rev-parse HEAD | tee KERNELSU_COMMIT.txt
          test -f kernel/drivers/kernelsu/Kconfig
          test -f kernel/drivers/kernelsu/Makefile
          grep -q '^config KSU_SUSFS$' kernel/drivers/kernelsu/Kconfig
          cp kernel/drivers/kernelsu/Kconfig KSU_KCONFIG.txt
          grep -n 'ksu_handle_execveat' kernel/fs/exec.c | tee MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_faccessat' kernel/fs/open.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_stat' kernel/fs/stat.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_vfs_read' kernel/fs/read_write.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_input_handle_event' kernel/drivers/input/input.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          ! grep -q 'ksu_handle_sys_reboot' kernel/kernel/reboot.c
          ! grep -q 'ksu_handle_newfstat_ret' kernel/fs/stat.c
          ! grep -q 'ksu_handle_fstat64_ret' kernel/fs/stat.c
          ! grep -q 'is_ksu_transition' kernel/security/selinux/hooks.c

      - name: Backport V55 compatibility fixes
        run: python3 tools/backport_trace_hex_str.py kernel

      - name: Install Arm GNU Toolchain 13.3.Rel1
        run: |
          curl -L --retry 5 --retry-delay 3 -o arm-gnu.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu.tar.xz
          GCC_PATH="$(find "$PWD" -type f -name aarch64-none-linux-gnu-gcc -print -quit)"
          test -n "$GCC_PATH"
          echo "$(dirname "$GCC_PATH")" >> "$GITHUB_PATH"
          "$GCC_PATH" --version | tee TOOLCHAIN.txt

      - name: Configure exact V55 plus full SUSFS except SUS_SU
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p out
          cp ../V55_BASELINE.config out/.config
          export ARCH=arm64 CROSS_COMPILE=aarch64-none-linux-gnu-
          scripts/config --file out/.config -e OVERLAY_FS -e KSU -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_OVERLAYFS -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME
          scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG -d KSU_SUSFS_SUS_SU
          make O=out olddefconfig
          cp out/.config ../dream2lte_susfs.config
          grep -E '^(CONFIG_OVERLAY_FS|CONFIG_KSU|CONFIG_KSU_SUSFS)|^# CONFIG_KSU_SUSFS' out/.config | tee ../SUSFS_CONFIG.txt
          grep -q '^CONFIG_OVERLAY_FS=y' out/.config
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set' out/.config

      - name: Enforce V55 drift allowlist
        run: |
          python3 -c "import json; from pathlib import Path
          def parse(p):
           d={}
           for line in Path(p).read_text(errors='replace').splitlines():
            if line.startswith('CONFIG_') and '=' in line: k,v=line.split('=',1); d[k]=v
            elif line.startswith('# CONFIG_') and line.endswith(' is not set'): d[line[2:-11]]='n'
           return d
          a=parse('V55_BASELINE.config'); b=parse('dream2lte_susfs.config'); ch=[{'symbol':k,'before':a.get(k),'after':b.get(k)} for k in sorted(set(a)|set(b)) if a.get(k)!=b.get(k)]; allow={'CONFIG_OVERLAY_FS','CONFIG_DEBUG_FS','CONFIG_BINARY_PRINTF','CONFIG_SEC_AVC_LOG'}; bad=[x for x in ch if not x['symbol'].startswith('CONFIG_KSU') and x['symbol'] not in allow and x['before'] is not None]; req={'CONFIG_OVERLAY_FS':'y','CONFIG_KSU':'y','CONFIG_KSU_SUSFS':'y','CONFIG_KSU_SUSFS_SUS_PATH':'y','CONFIG_KSU_SUSFS_SUS_MOUNT':'y','CONFIG_KSU_SUSFS_SUS_KSTAT':'y','CONFIG_KSU_SUSFS_SUS_OVERLAYFS':'y','CONFIG_KSU_SUSFS_TRY_UMOUNT':'y','CONFIG_KSU_SUSFS_SPOOF_UNAME':'y','CONFIG_KSU_SUSFS_ENABLE_LOG':'y','CONFIG_KSU_SUSFS_SUS_SU':'n'}; err=[{'symbol':k,'expected':v,'actual':b.get(k)} for k,v in req.items() if b.get(k)!=v]; r={'pass':not bad and not err,'total_changes':len(ch),'unexpected_changes':bad,'profile_errors':err,'changes':ch}; Path('CONFIG_GATE.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps({'total_changes':len(ch),'unexpected':len(bad),'profile_errors':len(err)},indent=2)); raise SystemExit(1 if bad or err else 0)"

      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64 CROSS_COMPILE=aarch64-none-linux-gnu-
          make O=out -j2 Image 2>&1 | tee ../BUILD_LOG.txt

      - name: Verify built SUSFS and KernelSU
        run: |
          set -euxo pipefail
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/vmlinux
          test -s kernel/out/System.map
          test -s kernel/out/fs/susfs.o
          test -s kernel/out/drivers/kernelsu/kernelsu.o
          file kernel/out/arch/arm64/boot/Image | tee IMAGE_FILE.txt
          nm kernel/out/fs/susfs.o | grep -iq susfs
          nm kernel/out/drivers/kernelsu/kernelsu.o | grep -iq ksu
          grep -iq susfs kernel/out/System.map
          cp kernel/out/arch/arm64/boot/Image Image-dream2lte-susfs
          cp kernel/out/System.map System.map-dream2lte-susfs
          printf 'SUSFS object: %s bytes\n' "$(stat -c %s kernel/out/fs/susfs.o)" | tee VERIFY_SUSFS.txt
          printf 'KernelSU object: %s bytes\n' "$(stat -c %s kernel/out/drivers/kernelsu/kernelsu.o)" | tee -a VERIFY_SUSFS.txt
          grep -i susfs kernel/out/System.map | head -n 40 >> VERIFY_SUSFS.txt
          sha256sum Image-dream2lte-susfs dream2lte_susfs.config V55_BASELINE.config System.map-dream2lte-susfs > SHA256SUMS.txt

      - name: Prepare evidence
        if: always()
        run: |
          test -f kernel/out/arch/arm64/boot/Image && cp kernel/out/arch/arm64/boot/Image Image-dream2lte-susfs || true
          test -f kernel/out/.config && cp kernel/out/.config dream2lte_susfs.config || true
          test -f kernel/out/System.map && cp kernel/out/System.map System.map-dream2lte-susfs || true
          sha256sum Image-dream2lte-susfs dream2lte_susfs.config V55_BASELINE.config System.map-dream2lte-susfs > SHA256SUMS.txt 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S8Plus-V55-source-full-SUSFS-no-SUS_SU
          if-no-files-found: warn
          retention-days: 7
          path: |
            Image-dream2lte-susfs
            dream2lte_susfs.config
            V55_BASELINE.config
            CONFIG_GATE.json
            System.map-dream2lte-susfs
            VERIFY_SUSFS.txt
            MANUAL_HOOK_EVIDENCE.txt
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
            KSU_HOOK_COMPAT_COMMIT.txt
            KSU_HOOK_COMPAT_LOG.txt
            KERNELSU_COMMIT.txt
            SUSFS_COMMIT.txt
            SUSFS_CONFIG.txt
            KSU_KCONFIG.txt
            TOOLCHAIN.txt
            BUILD_LOG.txt
            IMAGE_FILE.txt
            KERNEL_VERSION.txt
            SUSFS_PORT_LOG.txt
            SUSFS_PORT_STATUS.txt
            SUSFS_PORT_STATUS_BEFORE_RESOLVE.txt
            SUSFS_PORT_CONFLICT.diff
