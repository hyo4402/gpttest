name: Build S8 Plus SUSFS kernel

on:
  push:
    branches:
      - 'agent/alice-s8plus-susfs-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ksu-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install config dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3

      - name: Restore exact V55 embedded config
        run: |
          set -euxo pipefail
          cat > V55_CHUNK_SHA256SUMS.txt <<'EOF'
          9759f680d1b37f1493711665fe61bfd58cb0793dfca6ddf05bf6ec67e79a93fb  configs/v55_chunks/part00.b64
          8f251f201e5ebaf5d45c62038098addd3e05f829c251eebb29fb388c34a89df0  configs/v55_chunks/part01.b64
          0db07e70ca6d694f6e25418c0dcbc8bc075ff74fb025ddddb0e66588ee7edbd6  configs/v55_chunks/part02.b64
          bbde9919761434a8160184202a7052d9b1393972b1cad83a9bdc889e2f2f2d04  configs/v55_chunks/part03.b64
          9b68ca8ce339b0d351873d09166cdc5548bc32cf04049133169f411fb7b68c52  configs/v55_chunks/part04.b64
          f3b3b5c8428227dfe45ce1ba310f024061a7b087702f971eefed47b60ec87ad7  configs/v55_chunks/part05.b64
          e0aca3338228498cd8bb4b0f96174497963b293b2e49aa75e7ed303a0a833d06  configs/v55_chunks/part06.b64
          047a4b2bd77de047a25107b43d7c663057ec659b61b25ee7838fca7e8ad91a41  configs/v55_chunks/part07.b64
          2078ad4a510200cbe57d564166d117e30d2fdb254ea8d96f295e6b432918ed6b  configs/v55_chunks/part08.b64
          52490499df847acce551515ed2d6926f206e97968ee3e198ed4651e476363b0e  configs/v55_chunks/part09.b64
          b009ca8927a7078cd776738a25318b405ce16ae9de2515a8fb0e8ffd0071991f  configs/v55_chunks/part10.b64
          02203434f90dcaa36ca71904af611ead3aff4d298e5e75b11e4c1923c92f67f4  configs/v55_chunks/part11.b64
          EOF
          sha256sum -c V55_CHUNK_SHA256SUMS.txt
          cat configs/v55_chunks/part{00..11}.b64 > V55_CONFIG.b64
          echo "dacf46588d375e8b3e1943b950260f8c40bacb10f79db143bf0bd4b3488ff2c2  V55_CONFIG.b64" | sha256sum -c -
          base64 -d V55_CONFIG.b64 > V55_CONFIG.gz
          echo "7ca6bc454a72d88477ac94b6baa1185c193339c72d64e3c401a0c94a958b45cf  V55_CONFIG.gz" | sha256sum -c -
          gzip -dc V55_CONFIG.gz > V55_BASELINE.config
          echo "25534172654cc2ef053bc2b2580dc8e0d647a921624ad7bdea54024f07672c07  V55_BASELINE.config" | sha256sum -c -

      - name: Clone pinned V55 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch --branch sep-16.1 https://github.com/boloaimer/exynos-8895.git kernel
          test "$(git -C kernel rev-parse HEAD)" = "dcdaf6878e7f9497e1d90e25980decfa5d684f74"
          git -C kernel rev-parse HEAD | tee SOURCE_COMMIT.txt
          head -n 5 kernel/Makefile | tee KERNEL_VERSION.txt

      - name: Install pinned KernelSU-Next legacy tree
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git ksun
          git -C ksun fetch --depth 1 origin 706413e0ddd0ed644b55b7e60397546d4ea57257
          git -C ksun checkout --detach FETCH_HEAD
          test "$(git -C ksun rev-parse HEAD)" = "706413e0ddd0ed644b55b7e60397546d4ea57257"
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          cp -a ksun/kernel/. kernel/drivers/kernelsu/
          cp -a ksun/uapi kernel/drivers/kernelsu/uapi
          git -C ksun rev-parse HEAD | tee KERNELSU_COMMIT.txt
          test -f kernel/drivers/kernelsu/Kconfig
          test -f kernel/drivers/kernelsu/Makefile
          grep -n 'ksu_handle_execveat' kernel/fs/exec.c | tee MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_faccessat' kernel/fs/open.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_stat' kernel/fs/stat.c | tee -a MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_input_handle_event' kernel/drivers/input/input.c | tee -a MANUAL_HOOK_EVIDENCE.txt

      - name: Run olddefconfig with pinned KernelSU
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p out
          cp ../V55_BASELINE.config out/.config
          export ARCH=arm64
          make O=out olddefconfig
          cp out/.config ../CANDIDATE.config

      - name: Generate KSU provenance report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def parse(path):
              d={}
              for line in Path(path).read_text(errors='replace').splitlines():
                  if line.startswith('CONFIG_') and '=' in line:
                      k,v=line.split('=',1); d[k]=v
                  elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                      d[line[2:-11]]='n'
              return d
          a=parse('V55_BASELINE.config'); b=parse('CANDIDATE.config')
          changes=[]
          for k in sorted(set(a)|set(b)):
              if a.get(k)!=b.get(k): changes.append({'symbol':k,'before':a.get(k),'after':b.get(k)})
          meaningful=[x for x in changes if x['before'] is not None and x['after'] is not None]
          removed=[x for x in changes if x['before'] is not None and x['after'] is None]
          added=[x for x in changes if x['before'] is None and x['after'] is not None]
          report={
              'source_commit':Path('SOURCE_COMMIT.txt').read_text().strip(),
              'kernelsu_commit':Path('KERNELSU_COMMIT.txt').read_text().strip(),
              'total_changes':len(changes),
              'meaningful_value_changes':meaningful,
              'removed_symbols':removed,
              'new_source_symbols':added,
              'changes':changes,
          }
          Path('KSU_PROBE_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'total_changes':len(changes),'meaningful':len(meaningful),'removed':len(removed),'added':len(added)},indent=2))
          PY
          grep -E '^(CONFIG_KSU|# CONFIG_KSU)' CANDIDATE.config | tee KSU_CONFIG.txt
          sha256sum V55_BASELINE.config CANDIDATE.config KSU_PROBE_REPORT.json > SHA256SUMS.txt

      - name: Upload KSU probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: V55-sep16.1-pinned-KernelSU-probe
          retention-days: 7
          path: |
            SOURCE_COMMIT.txt
            KERNELSU_COMMIT.txt
            KERNEL_VERSION.txt
            MANUAL_HOOK_EVIDENCE.txt
            V55_BASELINE.config
            CANDIDATE.config
            KSU_CONFIG.txt
            KSU_PROBE_REPORT.json
            SHA256SUMS.txt
