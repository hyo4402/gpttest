name: Build S8 Plus SUSFS kernel

on:
  push:
    branches:
      - 'agent/alice-s8plus-susfs-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev lz4 python3 rsync xz-utils zip

      - name: Fetch pinned SUSFS source and KernelSU
        run: |
          git clone --depth 1 --single-branch --branch lineage-20.0-kernelsu-susfs https://github.com/fnr1r/android_kernel_samsung_universal8895.git kernel
          cd kernel
          test "$(git rev-parse HEAD)" = "7bc44731088e0e004345fcd71eac0fbf877849c1"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          git clone --no-checkout https://github.com/fnr1r/KernelSU.git KernelSU
          cd KernelSU
          git fetch --depth 1 origin ee03fa5bdd1eece21b15581b3bccd06c9d30afc1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "ee03fa5bdd1eece21b15581b3bccd06c9d30afc1"
          cd ..
          ln -s ../KernelSU/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          git rev-parse HEAD | tee ../KERNEL_COMMIT.txt
          git -C KernelSU rev-parse HEAD | tee ../KERNELSU_COMMIT.txt
          git submodule status --recursive | tee ../SUBMODULES.txt

      - name: Verify manual KernelSU hook integration
        working-directory: kernel
        run: |
          set -euxo pipefail
          grep -n 'ksu_handle_faccessat' fs/open.c | tee ../MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_execveat' fs/exec.c | tee -a ../MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_stat' fs/stat.c | tee -a ../MANUAL_HOOK_EVIDENCE.txt
          grep -n 'ksu_handle_input_handle_event' drivers/input/input.c | tee -a ../MANUAL_HOOK_EVIDENCE.txt

      - name: Install Arm GNU Toolchain 13.3.Rel1
        run: |
          curl -L --retry 5 --retry-delay 3 -o arm-gnu.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu.tar.xz
          GCC_PATH="$(find "$PWD" -type f -name aarch64-none-linux-gnu-gcc -print -quit)"
          test -n "$GCC_PATH"
          TOOLCHAIN_BIN="$(dirname "$GCC_PATH")"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          "$GCC_PATH" --version | tee TOOLCHAIN.txt

      - name: Configure dream2lte with safe SUSFS
        working-directory: kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          make O=out exynos8895-dream2lte_defconfig
          cp out/.config ../SOURCE_BASELINE.config
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -e KSU -e KSU_SUSFS
          scripts/config --file out/.config -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_SU -d KSU_SUSFS_ENABLE_LOG
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --file out/.config -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME
          make O=out olddefconfig
          grep -E '^(CONFIG_OVERLAY_FS|CONFIG_KSU|CONFIG_KSU_SUSFS)|^# CONFIG_KSU_SUSFS' out/.config | tee ../SUSFS_CONFIG.txt
          grep -q '^CONFIG_OVERLAY_FS=y' out/.config
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config

      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          make O=out -j2 Image 2>&1 | tee ../BUILD_LOG.txt

      - name: Verify SUSFS artifact
        run: |
          set -euxo pipefail
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/vmlinux
          test -s kernel/out/System.map
          test -s kernel/out/fs/susfs.o
          test -s kernel/out/drivers/kernelsu/kernelsu.o
          grep -q '^CONFIG_OVERLAY_FS=y' kernel/out/.config
          grep -q '^CONFIG_KSU=y' kernel/out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' kernel/out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set' kernel/out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set' kernel/out/.config
          nm kernel/out/fs/susfs.o | grep -iq 'susfs'
          nm kernel/out/drivers/kernelsu/kernelsu.o | grep -iq 'ksu'
          grep -iq 'susfs' kernel/out/System.map
          printf 'SUSFS object: %s bytes\n' "$(stat -c %s kernel/out/fs/susfs.o)" | tee VERIFY_SUSFS.txt
          printf 'KernelSU object: %s bytes\n' "$(stat -c %s kernel/out/drivers/kernelsu/kernelsu.o)" | tee -a VERIFY_SUSFS.txt
          grep -i 'susfs' kernel/out/System.map | head -n 30 >> VERIFY_SUSFS.txt

      - name: Prepare build outputs
        if: always()
        run: |
          test -f kernel/out/arch/arm64/boot/Image && cp kernel/out/arch/arm64/boot/Image Image-dream2lte-susfs || true
          test -f kernel/out/.config && cp kernel/out/.config dream2lte_susfs.config || true
          test -f kernel/out/System.map && cp kernel/out/System.map System.map-dream2lte-susfs || true
          sha256sum Image-dream2lte-susfs dream2lte_susfs.config SOURCE_BASELINE.config System.map-dream2lte-susfs > SHA256SUMS.txt 2>/dev/null || true

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S8Plus-dream2lte-SUSFS-source-config
          if-no-files-found: warn
          retention-days: 7
          path: |
            Image-dream2lte-susfs
            dream2lte_susfs.config
            SOURCE_BASELINE.config
            System.map-dream2lte-susfs
            VERIFY_SUSFS.txt
            MANUAL_HOOK_EVIDENCE.txt
            SHA256SUMS.txt
            KERNEL_COMMIT.txt
            KERNELSU_COMMIT.txt
            SUBMODULES.txt
            SUSFS_CONFIG.txt
            TOOLCHAIN.txt
            BUILD_LOG.txt
