name: Build S8 Plus SUSFS kernel

on:
  push:
    branches:
      - agent/alice-s8plus-susfs-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev lz4 python3 rsync xz-utils zip

      - name: Fetch pinned kernel source
        run: |
          git clone --recursive --branch lineage-20.0-kernelsu-susfs \
            https://github.com/fnr1r/android_kernel_samsung_universal8895.git kernel
          cd kernel
          git checkout 7bc44731088e0e004345fcd71eac0fbf877849c1
          git submodule sync --recursive
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../KERNEL_COMMIT.txt
          git submodule status --recursive | tee ../SUBMODULES.txt

      - name: Install Arm GNU Toolchain 13.3.Rel1
        run: |
          curl -L --retry 5 --retry-delay 3 \
            -o arm-gnu.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.3.Rel1-x86_64-aarch64-none-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Configure dream2lte with safe SUSFS profile
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          make O=out exynos8895-dream2lte_defconfig
          scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_SUSFS \
            -d KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -d KSU_SUSFS_ENABLE_LOG \
            -d KSU_SUSFS_SUS_SU
          make O=out olddefconfig
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS)' out/.config | tee ../SUSFS_CONFIG.txt

      - name: Build kernel and DTB
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          make O=out -j2 Image dtb.img 2>&1 | tee ../BUILD_LOG.txt

      - name: Verify SUSFS build
        run: |
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/arch/arm64/boot/dtb.img
          grep -q '^CONFIG_KSU_SUSFS=y' kernel/out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set' kernel/out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set' kernel/out/.config
          strings kernel/out/arch/arm64/boot/Image | grep -i -m1 susfs
          sha256sum kernel/out/arch/arm64/boot/Image kernel/out/arch/arm64/boot/dtb.img kernel/out/.config | tee SHA256SUMS.txt
          cp kernel/out/.config dream2lte_susfs.config
          cp kernel/out/arch/arm64/boot/Image Image-dream2lte-susfs
          cp kernel/out/arch/arm64/boot/dtb.img dtb-dream2lte-source.img

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: S8Plus-dream2lte-SUSFS-kernel
          if-no-files-found: error
          retention-days: 7
          path: |
            Image-dream2lte-susfs
            dtb-dream2lte-source.img
            dream2lte_susfs.config
            SHA256SUMS.txt
            KERNEL_COMMIT.txt
            SUBMODULES.txt
            SUSFS_CONFIG.txt
            BUILD_LOG.txt
